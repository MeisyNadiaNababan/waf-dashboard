services:
  waf-dashboard:
    build: .
    container_name: waf-dashboard
    ports:
      - "5000:5000"
    environment:
      - TZ=Asia/Jakarta
      # Opsional: isi untuk menimpa nilai default di config.py
      # - KIBANA_HOST=http://10.100.100.15:5601
      # - KIBANA_USERNAME=...
      # - KIBANA_PASSWORD=...
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
